name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # edited: a fixed title or description is checked again without a push.
    types: [opened, synchronize, reopened, edited]

concurrency:
  # An edit must not cancel the code checks of the same push.
  group: ci-${{ github.ref }}-${{ github.event.action == 'edited' && 'edited' || 'code' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Standard 2-vCPU hosted runners: the smallest GitHub offers.
  check:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Query test prerequisite
        shell: bash
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            case "$RUNNER_OS" in
              Linux) sudo apt-get update && sudo apt-get install --yes ripgrep ;;
              macOS) brew install ripgrep ;;
              *) echo "Unsupported query test platform: $RUNNER_OS" >&2; exit 1 ;;
            esac
          fi
          rg --version
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: memory hooks, real CLI and offline provider
        run: |
          cargo build --bins --locked
          cargo xtask memory-smoke --report memory-offline.json

  messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --package xtask --locked
      - name: PR title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s' "$TITLE" | cargo xtask check-message -
      - name: PR description has no tool attribution
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$BODY" | cargo xtask check-body
      - name: every commit follows Conventional Commits
        run: |
          for sha in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            git log -1 --format=%B "$sha" | cargo xtask check-message - || { echo "in commit $sha"; exit 1; }
          done
