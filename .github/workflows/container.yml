name: container
on:
  pull_request:
    branches: [main, feat/ssh-execution-transport]
    paths: ['Dockerfile', 'Cargo.toml', 'Cargo.lock', 'src/**', '.github/workflows/container.yml']
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime and export binaries
        run: |
          docker buildx build --load -t rusty-ci .
          docker buildx build --target bin --output type=local,dest=out .
          for binary in rusty rusty-memoryd rusty-cloud; do test -x "out/$binary"; done
          docker run --rm rusty-ci --version
          docker run --rm --entrypoint rusty-cloud rusty-ci ssh --help
          docker run --rm --entrypoint ssh rusty-ci -V
      - name: Rebuild after a source change using compiler cache
        run: |
          printf '\n// Container cache verification.\n' >> src/lib.rs
          docker buildx build --load -t rusty-ci .
          docker run --rm rusty-ci --version
