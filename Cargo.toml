[package]
name = "rusty"
default-run = "rusty"
version = "0.1.0"
edition = "2021"
description = "A tiny terminal coding agent powered by open models on NVIDIA's API"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
rustyline = { version = "14", default-features = false, features = ["custom-bindings", "with-file-history"] }
unicode-width = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", default-features = false, features = ["bundled"] }
flate2 = { version = "1", default-features = false, features = ["miniz_oxide"] }
# Already built for TLS; SHA-256, HMAC and randomness for the cloud launcher.
ring = "0.17"

[workspace]
# Repository tooling (`cargo xtask ...`); never shipped.
members = ["xtask"]

[profile.release]
lto = true
# One unit lets LTO see the whole crate: 6% smaller and no slower.
codegen-units = 1
strip = true
