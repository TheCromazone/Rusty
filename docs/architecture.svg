<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>How rusty turns a task into verified code</title>
<desc>The rusty CLI starts the agent loop: understand, inspect, edit, test. Context and the memory advisor on the left and read-only workers on the right only advise. Every tool call passes permissions and the infra gate before it runs locally or on Daytona, and its results return to the loop. A goal closes only after the fixed acceptance check passes on the final workspace, recording evidence; a failed check sends the work back to the loop.</desc>
<style>
  .bg { fill: #ffffff; }
  .t { fill: #1f2328; font-size: 14px; font-weight: 600; }
  .s { fill: #59636e; font-size: 12px; }
  .box { fill: #f6f8fa; stroke: #b4b2a9; stroke-width: 1; }
  .adv { fill: #ffffff; stroke: #888780; stroke-width: 1; stroke-dasharray: 4 3; }
  .loop { fill: #faece7; stroke: #b7410e; stroke-width: 1.5; }
  .loop-t { fill: #712b13; font-size: 15px; font-weight: 600; }
  .loop-s { fill: #993c1d; font-size: 12px; }
  .step { fill: #ffffff; stroke: #d85a30; stroke-width: 1; }
  .done { fill: #eaf3de; stroke: #3b6d11; stroke-width: 1; }
  .done-t { fill: #27500a; font-size: 14px; font-weight: 600; }
  .done-s { fill: #3b6d11; font-size: 12px; }
  .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
  .dash { stroke-dasharray: 3 3; }
  .fix { stroke: #d85a30; stroke-width: 1.5; fill: none; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .t { fill: #e6edf3; }
    .s { fill: #9198a1; }
    .box { fill: #161b22; stroke: #5f5e5a; }
    .adv { fill: #0d1117; stroke: #888780; }
    .loop { fill: #2a1610; stroke: #f0997b; }
    .loop-t { fill: #f5c4b3; }
    .loop-s { fill: #f0997b; }
    .step { fill: #0d1117; stroke: #d85a30; }
    .done { fill: #173404; stroke: #97c459; }
    .done-t { fill: #c0dd97; }
    .done-s { fill: #97c459; }
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#d85a30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" width="760" height="470"/>

<rect class="box" x="270" y="24" width="220" height="56" rx="8"/>
<text class="t" x="380" y="47" text-anchor="middle">rusty CLI</text>
<text class="s" x="380" y="66" text-anchor="middle">prompt · /goal · /loop</text>
<line class="arr" x1="380" y1="80" x2="380" y2="110" marker-end="url(#a)"/>

<rect class="loop" x="240" y="112" width="280" height="200" rx="10"/>
<text class="loop-t" x="380" y="136" text-anchor="middle">Agent loop</text>
<text class="loop-s" x="380" y="155" text-anchor="middle">auto picks careful · standard · vibe</text>
<rect class="step" x="255" y="172" width="110" height="36" rx="5"/><text class="t" x="310" y="195" text-anchor="middle">Understand</text>
<rect class="step" x="395" y="172" width="110" height="36" rx="5"/><text class="t" x="450" y="195" text-anchor="middle">Inspect</text>
<rect class="step" x="395" y="252" width="110" height="36" rx="5"/><text class="t" x="450" y="275" text-anchor="middle">Edit</text>
<rect class="step" x="255" y="252" width="110" height="36" rx="5"/><text class="t" x="310" y="275" text-anchor="middle">Test</text>
<line class="arr" x1="367" y1="190" x2="393" y2="190" marker-end="url(#a)"/>
<line class="arr" x1="450" y1="210" x2="450" y2="250" marker-end="url(#a)"/>
<line class="arr" x1="393" y1="270" x2="367" y2="270" marker-end="url(#a)"/>
<line class="arr" x1="310" y1="250" x2="310" y2="210" marker-end="url(#a)"/>

<rect class="adv" x="30" y="132" width="180" height="56" rx="8"/>
<text class="t" x="120" y="155" text-anchor="middle">Context</text>
<text class="s" x="120" y="174" text-anchor="middle">goal · plan · /compact</text>
<rect class="adv" x="30" y="232" width="180" height="56" rx="8"/>
<text class="t" x="120" y="255" text-anchor="middle">rusty-memoryd</text>
<text class="s" x="120" y="274" text-anchor="middle">BM25 lessons, file anchors</text>
<line class="arr dash" x1="210" y1="160" x2="238" y2="160" marker-end="url(#a)"/>
<line class="arr dash" x1="210" y1="260" x2="238" y2="260" marker-end="url(#a)"/>

<rect class="adv" x="550" y="132" width="180" height="56" rx="8"/>
<text class="t" x="640" y="155" text-anchor="middle">Read-only workers</text>
<text class="s" x="640" y="174" text-anchor="middle">task · swarm</text>
<line class="arr dash" x1="550" y1="160" x2="522" y2="160" marker-end="url(#a)"/>

<rect class="box" x="550" y="232" width="180" height="56" rx="8"/>
<text class="t" x="640" y="255" text-anchor="middle">Completion gate</text>
<text class="s" x="640" y="274" text-anchor="middle">review, then --verify check</text>
<line class="arr" x1="522" y1="250" x2="548" y2="250" marker-end="url(#a)"/>
<line class="fix" x1="548" y1="274" x2="522" y2="274" marker-end="url(#f)"/>

<path class="arr" d="M275 312 V330 H110 V358" marker-end="url(#a)"/>
<rect class="box" x="30" y="360" width="160" height="56" rx="8"/>
<text class="t" x="110" y="383" text-anchor="middle">Permissions</text>
<text class="s" x="110" y="402" text-anchor="middle">read-only → yolo</text>
<line class="arr" x1="190" y1="388" x2="213" y2="388" marker-end="url(#a)"/>
<rect class="box" x="215" y="360" width="150" height="56" rx="8"/>
<text class="t" x="290" y="383" text-anchor="middle">Infra gate</text>
<text class="s" x="290" y="402" text-anchor="middle">dry run · audit log</text>
<line class="arr" x1="365" y1="388" x2="388" y2="388" marker-end="url(#a)"/>
<rect class="box" x="390" y="360" width="140" height="56" rx="8"/>
<text class="t" x="460" y="383" text-anchor="middle">Tools</text>
<text class="s" x="460" y="402" text-anchor="middle">local or Daytona</text>
<line class="arr" x1="460" y1="358" x2="460" y2="314" marker-end="url(#a)"/>
<text class="s" x="468" y="340">results</text>

<line class="arr" x1="640" y1="288" x2="640" y2="358" marker-end="url(#a)"/>
<rect class="done" x="550" y="360" width="180" height="56" rx="8"/>
<text class="done-t" x="640" y="383" text-anchor="middle">Goal done</text>
<text class="done-s" x="640" y="402" text-anchor="middle">check record + evidence</text>

<line class="arr" x1="30" y1="446" x2="58" y2="446"/><text class="s" x="66" y="450">executes</text>
<line class="arr dash" x1="150" y1="446" x2="178" y2="446"/><text class="s" x="186" y="450">advises, read-only</text>
<line class="fix" x1="320" y1="446" x2="348" y2="446"/><text class="s" x="356" y="450">check failed, back to the loop</text>
</svg>
